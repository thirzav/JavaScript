<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../img/logoRecetario.jpg">
    <link rel="stylesheet" type="text/css" href="../CSS/index.css">
    <link rel="stylesheet" type="text/css" href="../CSS/contacto.css">
    <script src="../JS/global.js"></script>
    <script src="../JS/landingPage.js"></script>
    <script src="../JS/contacto.js"></script>
    <title>Catering 't Musje</title>
</head>

<body>
    <div id="principal">
        <header id="cabecera">
            <div id="div_header_left">
                <a href="https://www.facebook.com/?locale=es_ES">
                    <img src="../img/logoFacebook.png" alt="" class="header_img_logo">
                </a>
                <a href="https://www.instagram.com/">
                    <img src="../img/logoInsta.jpg" alt="" class="header_img_logo">
                </a>
                <a href="https://www.tiktok.com/es/">
                    <img src="../img/logoTiktok.webp" alt="" class="header_img_logo">
                </a>
                <a href="https://x.com/?lang=es">
                    <img src="../img/logoTwitter.jpg" alt="" class="header_img_logo">
                </a>
            </div>
            <div id="div_header_middle_img">
                <a href="index.html">
                    <img src="../img/logoCatering.jpg" alt="" class="logo_empresa">
                </a>
            </div>
            <div id="div_header_right">
                <p class="div_header_right_p">info@cateringtmusje.com</p>
            </div>
        </header>

        <nav id="navbar">
                <a href="index.html" class="navbar_item">HOME</a>
                <a href="categorias.html" class="navbar_item">CATEGORIAS</a>
                <a href="servicios.html" class="navbar_item">SERVICIOS</a>
                <a href="contacto.html" class="navbar_item">CONTACTO</a>
        </nav>

        <section id="contenido">
            <div id="section_principal">
                <div id="izquierda">
                    <div id="ubicacion">
                        <h1 class="titulo_contacto">Ubicación</h1>
                        <p class="txt" id="txt_calle">Calle de Arragón 3, 43200 Reus</p>
                        <p class="txt" id="txt_tel">Tel nr. 645 300 700</p>
                    </div>
                    <div id="siguenos">
                        <h1 class="titulo_contacto">Síguenos</h1>
                        <a href="https://www.facebook.com/?locale=es_ES" class="link_contacto">
                            <img src="../img/logoFacebook.png" alt="facebook" class="header_img_logo">
                        </a>
                        <a href="https://www.instagram.com/" class="link_contacto">
                            <img src="../img/logoInsta.jpg" alt="instagram" class="header_img_logo">
                        </a>
                        <a href="https://www.tiktok.com/es/" class="link_contacto">
                            <img src="../img/logoTiktok.webp" alt="tiktok" class="header_img_logo">
                        </a>
                        <a href="https://x.com/?lang=es" class="link_contacto">
                            <img src="../img/logoTwitter.jpg" alt="twitter" class="header_img_logo">
                        </a>
                    </div>
                </div>
                <div id="derecha">
                    <h1>Contacto</h1>
                    <input type="text" name="nom" id="nom" class="form_contacto" placeholder="Nombre">
                    <p id="nomIncorrecto" class="errorMensaje"></p>
                    <input type="email" name="email" id="email" class="form_contacto" placeholder="Correo electrónico">
                    <p id="emailIncorrecto" class="errorMensaje"></p>
                    <input type="text" name="asunto" id="asunto" class="form_contacto" placeholder="Asunto">
                    <p id="asuntoIncorrecto" class="errorMensaje"></p>
                    <textarea name="comentario" id="comentario" class="form_contacto" placeholder="Mensaje" maxlength="300"></textarea>
                    <input type="button" value="Enviar" class="btn" id="btnEnviar" onclick="enviarFormulario()">
                </div>
            </div>
        </section>

        <footer id="pie">
            <div class="div_pie">
                <p>Política de privacidad</p>
            </div>
            <div class="div_pie">
                <a href="index.html">
                    <img src="../img/logoCatering.jpg" alt="logo empresa" class="logo_empresa">
                </a>
            </div>
            <div id="div_datos_contacto" class="div_pie">
                <h4>Datos de contacto</h4>
                <p>Calle Arragón 3</p>
                <p>43200 Reus</p>
                <p>Tel. 675 938 921</p>
            </div>
        </footer>
    </div>
</body>

</html>
